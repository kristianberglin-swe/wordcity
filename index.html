.heading{font-size:clamp(1.7rem,3vw,2.3rem);color:#fff6e8;text-shadow:2px 3px #05080b}
.screen{position:relative;overflow:hidden;background:linear-gradient(155deg,#172739,#0c1521 78%);border:1px solid #4a6478;border-radius:17px;box-shadow:0 25px 60px #0009,inset 0 1px #ffffff1b;padding:clamp(18px,3vw,36px)}
.screen:before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,#ffbd55,#ed6487,#6d81c7);pointer-events:none}
.screen:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 59px,#ffffff05 60px),repeating-linear-gradient(90deg,transparent 0 59px,#ffffff04 60px);pointer-events:none;opacity:.38}
.screen>*{position:relative;z-index:1}.screenHead{border-bottom:1px solid #ffffff24;padding-bottom:15px;margin-bottom:23px}
.screen h2{font-size:clamp(2.1rem,5vw,3.6rem);color:#fff4df;text-shadow:3px 4px #05080c}
.btn{font-size:1.17rem;letter-spacing:.07em;border-radius:7px;border:1px solid #648097;background:linear-gradient(#2a4054,#1a293a);padding:12px 23px;box-shadow:0 4px 0 #08111b;transition:transform .14s,filter .14s,box-shadow .14s}
.btn:hover:not(:disabled){filter:brightness(1.18);transform:translateY(-2px)}.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #08111b}
.btn.gold{background:linear-gradient(180deg,#ffdb82,#efa83d);color:#1a130b;border-color:#ffe19b;box-shadow:0 4px 0 #86551b}
.sub{font-size:clamp(.95rem,1.6vw,1.16rem);font-weight:800;letter-spacing:.075em;text-transform:uppercase;color:#e0bb79}
.question{position:relative;width:fit-content;max-width:100%;margin:24px auto 28px;padding:18px 32px;font-size:clamp(2.6rem,6vw,5.4rem);line-height:1.06;color:#fff7e7;text-shadow:3px 4px #070d16;letter-spacing:.025em;background:linear-gradient(125deg,#24394e,#172638);border:1px solid #526d80;border-left:6px solid var(--gold);border-radius:9px;box-shadow:0 14px 28px #0006;overflow-wrap:anywhere}
.answers{max-width:950px;gap:15px;margin:25px auto}.answer{position:relative;border-radius:9px;border:2px solid #506c83;background:linear-gradient(165deg,#2a4053,#1c2c3c);box-shadow:0 5px 0 #0a131e,0 12px 24px #0004;font-family:'Barlow Condensed',Impact,sans-serif;letter-spacing:.04em;text-transform:uppercase;font-size:clamp(1.2rem,2.3vw,1.85rem);min-height:105px;transition:transform .15s,background .15s,border-color .15s}
.answer:hover:not(:disabled){background:linear-gradient(165deg,#39546a,#253b50);transform:translateY(-3px);border-color:#ffcd69}
.answer.correct,.word.correct{background:linear-gradient(155deg,#1e7751,#123d31)!important;box-shadow:0 0 24px #43f4a544!important}
.answer.wrong,.word.wrong{background:linear-gradient(155deg,#8b3440,#4d1d2b)!important;box-shadow:0 0 24px #ff747444!important}
.feedback{font-size:clamp(1.6rem,3vw,2.35rem);letter-spacing:.07em;text-shadow:1px 2px #000;min-height:48px}
.progress{height:11px;background:#070f18;border:1px solid #43586c;border-radius:99px;margin:13px 0 19px}.progress>div{background:linear-gradient(90deg,#e97170,#ffb34c,#ffe29a);box-shadow:0 0 15px #ffc56b8a}
.writeinput{max-width:690px;font-family:'Rajdhani',sans-serif;font-size:clamp(1.35rem,3vw,1.9rem);font-weight:700;background:#0b1420;border:2px solid #70849a;box-shadow:inset 0 4px 15px #0006,0 7px 18px #0005;border-radius:8px;letter-spacing:.04em}
.writeinput:focus{border-color:#ffd16d;outline:2px solid #ffd16d55}.hint{font-family:'Barlow Condensed',sans-serif;font-size:1.5rem;color:#ffcb72}.levels .btn{font-size:1.5rem;min-width:65px}.levels .chosen{background:#ffc45c;border-color:#ffdf9b;color:#15110b}
.matchGrid{max-width:1080px;margin:20px auto;gap:25px}.matchCol{gap:12px}.word{border-radius:9px;border:2px solid #5a7188;background:linear-gradient(160deg,#263d52,#172737);box-shadow:0 4px 0 #0b131e;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.025em;font-size:clamp(1.15rem,2vw,1.55rem);padding:14px;min-height:65px;transition:transform .13s}.word:hover:not(.matched){transform:translateY(-2px);border-color:#ffd17d}.word.selected{border-color:#ffd16b;background:#6d4b25;box-shadow:0 0 16px #ffc15c55}
.fall-arena{border:3px solid #aa875a;border-radius:11px;box-shadow:inset 0 0 60px #0008,0 14px 30px #0007}.fall-word{font-family:'Barlow Condensed',Impact,sans-serif;font-size:clamp(1rem,1.9vw,1.35rem);letter-spacing:.03em;text-transform:uppercase;background:linear-gradient(150deg,#3c5369,#172737);border:2px solid #ffd280;box-shadow:0 5px 0 #0b1521,0 9px 20px #0008}.fall-word:hover{filter:brightness(1.18)}.lives{font-family:'Barlow Condensed',sans-serif;font-size:1.65rem;letter-spacing:.07em}
.listTable{border-collapse:separate;border-spacing:0 6px;max-width:1100px}.listTable th{font-size:1.3rem;color:#ffc76e;background:#243448}.listTable td{font-size:1.22rem;background:#1b2c3c;border-bottom:1px solid #344d60}.listTable tr td:first-child{font-weight:800;color:#fff4dd;border-left:4px solid #ffc15c}.listTable tr td:last-child{color:#e0eaf3}.listTable td,.listTable th{padding:13px 17px}
.summary{max-width:740px;margin:35px auto;padding:38px 25px;border:1px solid #536c7e;border-radius:13px;background:linear-gradient(#22384b,#101c2a);box-shadow:0 20px 45px #0007}.summary h3{font-size:clamp(2.3rem,5vw,4rem);margin:0 0 12px}.summary strong{font-size:1.6em}
@media(max-width:650px){.screen{padding:16px 11px}.screenHead{gap:10px}.screen h2{font-size:2.3rem}.question{padding:13px 18px;font-size:clamp(2.1rem,9vw,3.4rem)}.answer{min-height:75px;font-size:1.35rem}.answers{gap:9px}.matchGrid{gap:9px}.word{font-size:1rem;padding:10px 5px}.listTable td{font-size:1rem;padding:10px}}
@media(prefers-reduced-motion:reduce){.answer,.btn,.word{transition:none}}

function home(){clearTimer();$('#screen').classList.remove('active');$('#home').style.display='block';game.innerHTML='';}
$('#back').addEventListener('click',home);
function start(m){clearTimer();mode=m;order=shuffle(WORDS.map((_,i)=>i));idx=0;correct=0;wrong=0;locked=false;matched=0;lives=3;$('#home').style.display='none';$('#screen').classList.add('active');$('#modeTitle').textContent=({match:'MATCHA',click:'KLICKA',write:'SKRIV',shoot:'SHOOTOUT',all:'SE ALLA ORDEN'})[m];if(m==='all')return allWords();if(m==='match')return matchStart();if(m==='write')return writeStart();if(m==='shoot')return shootQuestion();clickQuestion()}
document.querySelectorAll('[data-mode]').forEach(el=>el.addEventListener('click',()=>start(el.dataset.mode)));
function topProgress(n=idx,total=WORDS.length){return `<div class="sub">${Math.min(n,total)} / ${total} · ${correct} rätt</div><div class="progress"><div style="width:${100*Math.min(n,total)/total}%"></div></div>`}
function finish(extra=''){clearTimer();game.innerHTML=`<div class="summary"><h3>UPPDRAG SLUTFÖRT</h3><p><strong>${correct}</strong> rätt ${extra}</p><p>${wrong} fel</p><div class="row"><button class="btn gold" id="again">SPELA IGEN</button><button class="btn" id="endhome">TILL MENYN</button></div></div>`;$('#again').onclick=()=>start(mode);$('#endhome').onclick=home}
function nextButton(fn){const b=$('#next');if(b)b.onclick=fn}
function clickQuestion(){if(idx>=order.length)return finish();locked=false;let w=WORDS[order[idx]],others=shuffle(WORDS.filter(x=>x!==w).map(x=>x[1])).slice(0,3);let opts=shuffle([w[1],...others]);game.innerHTML=topProgress()+`<div class="sub">Välj rätt svensk översättning</div><div class="question">${esc(w[0])}</div><div class="answers">${opts.map(x=>`<button class="answer" data-answer="${esc(x)}">${esc(x)}</button>`).join('')}</div><div class="feedback" id="fb"></div><div class="center"><button class="btn gold" id="next" hidden>NÄSTA →</button></div>`;document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{if(locked)return;locked=true;let ok=b.dataset.answer===w[1];ok?correct++:wrong++;document.querySelectorAll('.answer').forEach(a=>{a.disabled=true;if(a.dataset.answer===w[1])a.classList.add('correct');else if(a===b)a.classList.add('wrong')});$('#fb').textContent=ok?'RÄTT!':'Rätt svar: '+w[1];$('#fb').className='feedback '+(ok?'good':'bad');$('#next').hidden=false;});nextButton(()=>{idx++;clickQuestion()})}
function writeStart(){game.innerHTML=`<div class="sub">Välj hjälpnivå – 1 är lättast och 5 är svårast</div><div class="levels">${[1,2,3,4,5].map(n=>`<button class="btn ${n===level?'chosen':''}" data-level="${n}">${n}</button>`).join('')}</div><div class="center"><button class="btn gold" id="begin">STARTA SKRIV</button></div>`;document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=+b.dataset.level;writeStart()});$('#begin').onclick=writeQuestion}
function normalize(s){return s.toLocaleLowerCase('sv').trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9åäö]/g,'')}
function writeQuestion(){if(idx>=order.length)return finish();locked=false;let w=WORDS[order[idx]],answer=w[0],hint='';if(level===1)hint=answer[0]+' '+ '• '.repeat(Math.max(0,answer.length-2))+answer.at(-1)+' ('+answer.length+' bokstäver)';if(level===2)hint=answer.slice(0,2)+'… ('+answer.length+' bokstäver)';if(level===3)hint=answer[0]+'…';if(level===4)hint=answer.length+' bokstäver';game.innerHTML=topProgress()+`<div class="sub">Skriv det engelska ordet</div><div class="question">${esc(w[1])}</div><div class="hint">${esc(hint)}</div><form id="writeForm"><input class="writeinput" id="wordInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Skriv på engelska…" required><div class="center"><button class="btn gold" id="check" type="submit">SVARA</button></div></form><div class="feedback" id="fb"></div><div class="center"><button class="btn gold" id="next" hidden>NÄSTA →</button></div>`;$('#writeForm').onsubmit=e=>{e.preventDefault();if(locked)return;locked=true;let ok=normalize($('#wordInput').value)===normalize(answer);ok?correct++:wrong++;$('#fb').textContent=ok?'RÄTT!':'Rätt svar: '+answer;$('#fb').className='feedback '+(ok?'good':'bad');$('#wordInput').disabled=true;$('#check').disabled=true;$('#next').hidden=false;$('#next').focus()};nextButton(()=>{idx++;writeQuestion()});$('#wordInput').focus()}
function matchStart(){idx=0;correct=0;wrong=0;matchBatchNext()}
function matchBatchNext(){if(idx>=order.length)return finish();let ids=order.slice(idx,idx+5),right=shuffle(ids);matched=0;selection=null;game.innerHTML=topProgress(idx)+`<p class="sub">Klicka först på ett engelskt ord, sedan på dess svenska översättning.</p><div class="matchGrid"><div class="matchCol">${ids.map(id=>`<button class="word" data-side="en" data-id="${id}">${esc(WORDS[id][0])}</button>`).join('')}</div><div class="matchCol">${right.map(id=>`<button class="word" data-side="sv" data-id="${id}">${esc(WORDS[id][1])}</button>`).join('')}</div></div><div class="feedback" id="fb"></div>`;game.querySelectorAll('.word').forEach(b=>b.onclick=()=>{if(b.classList.contains('matched'))return;if(!selection){if(b.dataset.side!=='en'){ $('#fb').textContent='Välj ett engelskt ord först';return}selection=b;b.classList.add('selected');return}if(b===selection){selection.classList.remove('selected');selection=null;return}if(b.dataset.side!=='sv')return;let first=selection;selection=null;first.classList.remove('selected');if(first.dataset.id===b.dataset.id){first.classList.add('matched');b.classList.add('matched');correct++;matched++;$('#fb').textContent='RÄTT!';$('#fb').className='feedback good';if(matched===ids.length){idx+=ids.length;setTimeout(matchBatchNext,550)}}else{wrong++;$('#fb').textContent='Försök igen!';$('#fb').className='feedback bad';first.classList.add('wrong');b.classList.add('wrong');setTimeout(()=>{first.classList.remove('wrong');b.classList.remove('wrong')},450)}})}
function shootQuestion(){
 clearTimer();if(idx>=order.length)return finish('· '+lives+' liv kvar');if(lives<=0)return finish('· Slut på liv');
 locked=false;const w=WORDS[order[idx]];
 const options=shuffle([w[1],...shuffle(WORDS.filter(x=>x!==w).map(x=>x[1])).slice(0,3)]);
 game.innerHTML=topProgress()+`<div class="row"><span class="lives" id="shootLives">${'♥ '.repeat(lives)}</span><span class="sub">Rätt träff ger poäng · Fel träff eller miss kostar ett liv</span></div><div class="question shoot-question">${esc(w[0])}</div><div class="fall-arena" id="fallArena" tabindex="0" aria-label="Skjut på rätt översättning"><div class="fall-crosshair" id="fallCrosshair"></div>${options.map((x,i)=>`<button type="button" class="fall-word" data-value="${esc(x)}" style="left:${[13,38,63,85][i]}%;top:-90px">${esc(x)}</button>`).join('')}<div class="fall-ground"></div></div><div class="feedback" id="fb" aria-live="polite"></div>`;
 const arena=$('#fallArena'),cross=$('#fallCrosshair'),targets=[...arena.querySelectorAll('.fall-word')];
 let frame=0,previous=0,elapsed=0,ended=false;const duration=7500,offsets=[0,450,850,1250];
 function endRound(ok,message,hit){if(ended)return;ended=true;locked=true;clearTimer();if(ok){correct++;}else{wrong++;lives=Math.max(0,lives-1)}
 $('#fb').textContent=message;$('#fb').className='feedback '+(ok?'good':'bad');if(hit)hit.classList.add(ok?'fall-hit':'fall-miss');
 setTimeout(()=>{if(mode!=='shoot')return;idx++;shootQuestion()},850)}
 arena.addEventListener('pointermove',e=>{const r=arena.getBoundingClientRect();cross.style.left=(e.clientX-r.left)+'px';cross.style.top=(e.clientY-r.top)+'px'});
 arena.addEventListener('pointerdown',e=>{if(ended)return;if(e.target.closest('.fall-word'))return;endRound(false,'MISS! Du sköt förbi. Rätt svar: '+w[1])});
 targets.forEach(t=>t.addEventListener('click',e=>{e.stopPropagation();if(ended)return;const ok=t.dataset.value===w[1];endRound(ok,ok?'TRÄFF!':'FEL ORD! Rätt svar: '+w[1],t)}));
 function tick(now){if(ended||mode!=='shoot')return;if(!previous)previous=now;elapsed+=Math.min(50,now-previous);previous=now;
 const h=arena.clientHeight;let bottom=false;
 targets.forEach((t,i)=>{const progress=Math.max(0,(elapsed-offsets[i])/duration);const y=-85+progress*(h+125);t.style.top=y+'px';if(y+t.offsetHeight>=h-12)bottom=true});
 if(bottom){endRound(false,'FÖR SENT! Orden nådde botten. Rätt svar: '+w[1]);return}frame=requestAnimationFrame(tick)}
 arenaTimer={stop:()=>cancelAnimationFrame(frame)};frame=requestAnimationFrame(tick);
}
function allWords(){game.innerHTML=`<p class="sub">Stop 3 · Alla 13 engelska glosor med svenska översättningar</p><table class="listTable"><thead><tr><th>Engelska</th><th>Svenska</th></tr></thead><tbody>${WORDS.map(w=>`<tr><td><strong>${esc(w[0])}</strong></td><td>${esc(w[1])}</td></tr>`).join('')}</tbody></table>`}
</script></body></html>
